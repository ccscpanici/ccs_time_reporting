{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Request Timesheet Reopen</h1>

<div class="card shadow-sm border-0 rounded-4">
  <div class="card-body">
    <p class="text-muted">
      Week of {{ timesheet.week_start }} · Status: {{ timesheet.get_status_display }}
    </p>

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label" for="{{ form.reason.id_for_label }}">
          Reason
        </label>
        {{ form.reason }}
        {% if form.reason.errors %}
          <div class="text-danger small mt-1">{{ form.reason.errors }}</div>
        {% endif %}
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">
          Submit Request
        </button>
        <a class="btn btn-outline-secondary" href="{{ timesheet.get_absolute_url }}">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
